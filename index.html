<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smotiva — Digital Growth Partner</title>
    <meta name="description" content="Smotiva Digital Ltd is a digital growth partner that helps businesses build and improve their digital presence through strategy, brand identity, digital products, and visual communication." />
    <meta property="og:title" content="Smotiva — Digital Growth Partner" />
    <meta property="og:description" content="Smotiva Digital Ltd is a digital growth partner that helps businesses build and improve their digital presence through strategy, brand identity, digital products, and visual communication." />
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('smotiva_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
